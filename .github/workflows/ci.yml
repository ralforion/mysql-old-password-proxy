name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pins:
    name: Action pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify every Action is pinned to its named release
        run: ./scripts/check-action-pins.sh

  build:
    name: Build and unit test
    needs: pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # No third-party dependencies means no go.sum, which the module cache
          # keys on: leaving it enabled only produces a "Dependencies file is
          # not found" warning on every run.
          cache: false

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test -race -count=1 ./...

      - name: Coverage
        run: |
          mkdir -p bin
          go test -coverpkg=./internal/... -coverprofile=bin/cover.out ./test/unit/...
          go tool cover -func=bin/cover.out | tail -1

      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -o bin/mysql-old-password-proxy .

      # Re-derived from the module graph on every run. The notice's claim is that
      # nothing third-party is redistributed, and the only way that claim stays
      # true is for the first added dependency to turn this red.
      - name: Third-party notices are current
        run: ./scripts/gen-notices.sh --check

      - name: Image builds
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          build-args: |
            VERSION=ci-${{ github.sha }}

  integration:
    needs: pins
    name: Integration (real MySQL servers)
    runs-on: ubuntu-latest
    # The suite starts MySQL 5.5 and 5.6 containers and pulls three client
    # images, so it is slower than the unit tests but still well under an hour.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # No third-party dependencies means no go.sum, which the module cache
          # keys on: leaving it enabled only produces a "Dependencies file is
          # not found" warning on every run.
          cache: false

      - name: Pre-pull images
        run: |
          for image in mysql:5.5 mysql:5.6 mysql:8.0 mariadb:10.11; do
            docker pull --platform linux/amd64 "$image" &
          done
          wait

      - name: Integration tests
        run: go test -tags integration -count=1 -timeout 40m -v ./test/integration/...

  security:
    needs: pins
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # No third-party dependencies means no go.sum, which the module cache
          # keys on: leaving it enabled only produces a "Dependencies file is
          # not found" warning on every run.
          cache: false

      # There are no third-party dependencies, so this is really a check on the
      # Go standard library and toolchain version.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
