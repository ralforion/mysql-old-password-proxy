name: Release

# Publishes a multi-architecture image to Docker Hub.
#
#   push to main   -> :edge and :main-<sha>
#   tag v1.2.3     -> :1.2.3, :1.2, :1 and :latest
#
# Requires two repository secrets:
#   DOCKERHUB_USERNAME  the Docker Hub account that owns the repository
#   DOCKERHUB_TOKEN     an access token from Docker Hub -> Account Settings ->
#                       Personal access tokens, with Read & Write scope.
#                       Never the account password.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'ralforion/mysql-old-password-proxy' }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Never publish an image that has not passed its tests.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Integration tests
        run: go test -tags integration -count=1 -timeout 40m ./test/integration/...

  publish:
    name: Build and push
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # so git describe sees tags

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive the version
        id: version
        run: echo "value=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch,prefix=,suffix=-{{sha}}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=mysql-old-password-proxy
            org.opencontainers.image.description=MySQL proxy that speaks pre-4.1 (mysql_old_password) authentication to a legacy server on behalf of modern clients
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.vendor=RALFORION d.o.o.
            org.opencontainers.image.source=https://github.com/ralforion/mysql-old-password-proxy

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the published image
        run: |
          set -euo pipefail
          image="${{ env.IMAGE }}@${{ steps.push.outputs.digest }}"
          echo "testing $image"
          # The image is a single static binary on scratch, so -version is the
          # only thing that can be run without a backend to talk to.
          got=$(docker run --rm --platform linux/amd64 "$image" -version)
          echo "$got"
          case "$got" in
            *"${{ steps.version.outputs.value }}"*) ;;
            *) echo "the image does not report the version it was built with"; exit 1 ;;
          esac

      - name: Update the Docker Hub description
        if: startsWith(github.ref, 'refs/tags/v')
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE }}
          readme-filepath: ./docs/DOCKERHUB.md
          short-description: "Lets modern MySQL clients reach a legacy server that only accepts pre-4.1 authentication"

      - name: Summary
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "digest: \`${{ steps.push.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
