name: Release

# Publishes a multi-architecture image to Docker Hub.
#
#   push to main   -> :edge and :main-<sha>
#   tag v1.2.3     -> :1.2.3, :1.2, :1 and :latest
#
# Requires two repository secrets:
#   DOCKERHUB_USERNAME  the Docker Hub account that owns the repository
#   DOCKERHUB_TOKEN     an access token from Docker Hub -> Account Settings ->
#                       Personal access tokens, with Read & Write scope.
#                       Never the account password.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'ralforion/mysql-old-password-proxy' }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Never publish an image that has not passed its tests.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # No third-party dependencies means no go.sum, which the module cache
          # keys on: leaving it enabled only produces a "Dependencies file is
          # not found" warning on every run.
          cache: false
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Integration tests
        run: go test -tags integration -count=1 -timeout 40m ./test/integration/...

  publish:
    name: Build and push
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the GitHub release for a tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # so git describe sees tags

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive the version
        id: version
        run: echo "value=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch,prefix=,suffix=-{{sha}}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=mysql-old-password-proxy
            org.opencontainers.image.description=MySQL proxy that speaks pre-4.1 (mysql_old_password) authentication to a legacy server on behalf of modern clients
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.vendor=RALFORION d.o.o.
            org.opencontainers.image.source=https://github.com/ralforion/mysql-old-password-proxy

      - name: Build and push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the published image
        run: |
          set -euo pipefail
          image="${{ env.IMAGE }}@${{ steps.push.outputs.digest }}"
          echo "testing $image"
          # The image is a single static binary on scratch, so -version is the
          # only thing that can be run without a backend to talk to.
          got=$(docker run --rm --platform linux/amd64 "$image" -version)
          echo "$got"
          case "$got" in
            *"${{ steps.version.outputs.value }}"*) ;;
            *) echo "the image does not report the version it was built with"; exit 1 ;;
          esac

      - name: Update the Docker Hub description
        if: startsWith(github.ref, 'refs/tags/v')
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE }}
          readme-filepath: ./docs/DOCKERHUB.md
          short-description: "Lets modern MySQL clients reach a legacy server that only accepts pre-4.1 authentication"

      # The tag alone says nothing about what changed. CHANGELOG.md is the
      # written account, so the notes come from its section for this version;
      # the commit subjects are the fallback when a release predates an entry.
      - name: Create the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          previous=$(git tag --sort=-version:refname | grep -v "^$TAG$" | head -1 || true)

          {
            echo "## Image"
            echo
            echo '```sh'
            echo "docker pull ${{ env.IMAGE }}:$version"
            echo '```'
            echo
            echo "\`linux/amd64\` and \`linux/arm64\`, a single static binary on \`scratch\`."
            echo
            echo "\`\`\`"
            echo "digest: $DIGEST"
            echo "\`\`\`"
            echo

            # Everything between this version's heading and the next one.
            notes=$(awk -v v="$version" '
              $0 ~ "^## \\[" v "\\]" { found = 1; next }
              found && /^## \[/        { exit }
              found                      { print }
            ' CHANGELOG.md | sed -e '/./,$!d')

            if [ -n "$notes" ]; then
              echo "$notes"
            else
              echo "## Changes"
              echo
              if [ -n "$previous" ]; then
                git log --no-merges --pretty=format:'- %s' "$previous..$TAG"
                echo
              else
                git log --no-merges --pretty=format:'- %s' "$TAG"
                echo
              fi
            fi

            if [ -n "$previous" ]; then
              echo
              echo "**Full diff**: https://github.com/${{ github.repository }}/compare/$previous...$TAG"
            fi
          } > notes.md

          echo "--- release notes ---"
          cat notes.md

          # Re-running a release updates the notes rather than failing on a
          # release that already exists.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
          fi

      - name: Summary
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "digest: \`${{ steps.push.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
