# mysql-old-password-proxy — Kubernetes manifests.
#
# Placeholders to replace before applying:
#   NAMESPACE          the namespace to deploy into
#   IMAGE_REF          e.g. docker.io/ralforion/mysql-old-password-proxy:v0.1.0
#                      Pin a tag or a digest; never :latest, or a rollout
#                      becomes untraceable.
#   LEGACY_HOST:PORT   the legacy MySQL server
#   LEGACY_USER        the account on the legacy server
#
# The Secret here is a template. Do not commit real passwords: create it out of
# band, or from a sealed secret / external secret operator.
#
#   kubectl -n NAMESPACE create secret generic mysql-old-password-proxy \
#     --from-literal=backend-password='...' \
#     --from-literal=frontend-password='...'
---
apiVersion: v1
kind: Secret
metadata:
  name: mysql-old-password-proxy
  namespace: NAMESPACE
type: Opaque
stringData:
  # The legacy server's password. The proxy needs it in plaintext to compute
  # the pre-4.1 response, so this cannot be a hash.
  backend-password: "CHANGE_ME"
  # What clients present to the proxy. A separate credential on purpose:
  # rotating it does not require touching the legacy server.
  frontend-password: "CHANGE_ME"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-old-password-proxy
  namespace: NAMESPACE
  labels:
    app.kubernetes.io/name: mysql-old-password-proxy
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: mysql-old-password-proxy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysql-old-password-proxy
    spec:
      # Keep the two replicas off the same node, so losing a node does not take
      # the query path with it.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: mysql-old-password-proxy

      # The proxy holds no state, but it does hold live query connections, so
      # give in-flight work time to finish. It matches -shutdown-timeout below.
      terminationGracePeriodSeconds: 40

      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: proxy
          image: IMAGE_REF
          imagePullPolicy: IfNotPresent
          args:
            - -listen=:3306
            - -health-addr=:8081
            - -backend=LEGACY_HOST:PORT
            - -backend-user=LEGACY_USER
            # The username clients present. Defaults to -backend-user; set it
            # explicitly so the two credentials stay visibly distinct.
            - -frontend-user=LEGACY_USER
            # MySQL 5.0 has no utf8mb4, and modern drivers ask for it.
            - -rewrite-utf8mb4=true
            # What the proxy claims to be. Too new and a driver assumes
            # features the legacy server lacks; too old and it may refuse to
            # connect at all. Tune against the real client.
            - -server-version=5.5.62-auth-relay
            - -shutdown-timeout=30s
            # Turn on when a driver's session setup hits something the legacy
            # server rejects, and read the logs to find out what:
            # - -log-queries=true
            # Then, if a statement has to be neutralised, answer it locally:
            # - -fake-ok-regex=(?i)^SET\s+(session_track|@@session\.session_track)

          env:
            - name: MYSQL_RELAY_BACKEND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-old-password-proxy
                  key: backend-password
            - name: MYSQL_RELAY_FRONTEND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-old-password-proxy
                  key: frontend-password
            # Go sizes its heap to this rather than to the node's memory, which
            # keeps the GC from growing into the limit and being OOM-killed.
            # Set it just under resources.limits.memory.
            - name: GOMEMLIMIT
              value: "96MiB"

          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP

          # Probe the HTTP endpoint, not the MySQL port: a TCP probe on 3306
          # would open a client connection every few seconds, and the point of
          # the separate port is that probing never touches the legacy server.
          startupProbe:
            httpGet: { path: /healthz, port: health }
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet: { path: /healthz, port: health }
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: health }
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          # A relayed connection costs on the order of tens of kilobytes: two
          # goroutines, two 4 KB read buffers and a pooled 32 KB copy buffer.
          # These figures leave room for a few hundred concurrent sessions.
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              # No CPU limit on purpose: throttling a proxy on the query path
              # shows up as latency in every query behind it. The request
              # reserves what it needs; set a limit only if your policy demands
              # one, and keep it generous (500m or more).
              memory: 128Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-old-password-proxy
  namespace: NAMESPACE
  labels:
    app.kubernetes.io/name: mysql-old-password-proxy
spec:
  # ClusterIP only. Nothing about this should be reachable from outside the
  # cluster: both hops are plaintext.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mysql-old-password-proxy
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
      protocol: TCP
---
# Keeps a rolling node drain from taking both replicas at once.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mysql-old-password-proxy
  namespace: NAMESPACE
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mysql-old-password-proxy
